[project]
name = "kev-memory"   # project: defrost-ai
version = "1.0.0"
description = "Hybrid-RAG knowledge memory for codebases and document collections: BM25 + Kev-Ret dense retrieval + Kev-Rerank, with doc-to-code links from graphify's AST graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "torch>=2.6",
    "transformers>=5.17,<6",
    "peft>=0.21",
    "safetensors>=0.4.3",
]

[project.optional-dependencies]
code = ["graphifyy==0.4.32"]          # code graph (tree-sitter AST); without it the memory is text-only
mcp = ["mcp>=1.2,<2"]                 # `kev-memory mcp`: MCP server for Claude Code / Desktop / Cursor
shepherd = ["shepherd-ai"]             # reviewable memory refreshes + memory-grounded agent tasks
eval = ["ragas==0.4.3", "langchain-community>=0.3,<0.3.28"]
dev = ["pytest>=8"]

[project.scripts]
kev-memory = "kev_memory.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kev_memory*"]

[tool.setuptools.package-data]
"kev_memory.integrations.claude_commands" = ["*.md"]
"kev_memory.assets" = ["doc_rules/*", "doc_rules/tools/*"]
